# BipedalWalker-v3 (needs `.[box2d]`). "Solved" ~ 300. Legacy FYP primary benchmark.
label: sac_bipedal
seed: 0
device: auto
out_dir: runs

env:
  id: BipedalWalker-v3
  action_scale: 1.0

agent:
  kind: sac
  gamma: 0.99
  tau: 0.005
  lr: 0.0003
  batch_size: 256
  buffer_capacity: 1000000
  warmup_steps: 10000
  autotune_entropy: true
  net:
    hidden: [256, 256]
    layernorm: true          # the LayerNormP* line was the FYP's best

train:
  total_steps: 1000000
  eval_every_steps: 20000
  eval_episodes: 10
  checkpoint_every_steps: 100000
