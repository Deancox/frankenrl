[project]
name = "frankenrl"
version = "0.1.0"
description = "Composable hybrid RL agents (SAC/TD3/PPO parts + swappable advantage estimators)."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.2",
    "gymnasium>=0.29",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
box2d = ["gymnasium[box2d]>=0.29"]     # BipedalWalker-v3
mujoco = ["gymnasium[mujoco]>=0.29"]   # Humanoid-v5
logging = ["tensorboard>=2.14"]
analysis = ["pandas>=2.0", "matplotlib>=3.7", "scipy>=1.11"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
frankenrl = "frankenrl.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frankenrl"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
